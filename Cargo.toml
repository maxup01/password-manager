[package]
name = "password-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6.0", features = ["alloc"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
sha2 = { version = "0.11.0" }
unicode-normalization = { version = "0.1.0" }
zeroize = { version = "1.9.0" }
hkdf = { version = "0.13.0" }
thiserror = { version = "2.0.0" }
chacha20poly1305 = { version = "0.11.0" }
redb = { version = "4.3.0" }
ratatui = { version = "0.30.0" }
